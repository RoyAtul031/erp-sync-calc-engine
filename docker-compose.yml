version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: erp_esg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_esg_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: erp_esg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: erp_esg_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_DB=erp_esg_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: erp_esg_celery_worker
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_DB=erp_esg_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    build: .
    container_name: erp_esg_celery_beat
    restart: unless-stopped
    command: celery -A core beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_DB=erp_esg_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
